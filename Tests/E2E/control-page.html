<!doctype html>
<html><head><meta charset="utf-8"><title>idle</title>
<style>body{margin:0;font:16px -apple-system}button{position:absolute;left:40px;top:40px;width:200px;height:80px;font-size:20px}input{position:absolute;left:40px;top:160px;width:300px;height:40px;font-size:18px}</style></head>
<body>
<!-- The desktop-control E2E reads results from the tab title. -->
<button onclick="window.n=(window.n||0)+1;document.title='clicked '+window.n+' | '+document.getElementById('field').value">Click me</button>
<input id="field" placeholder="Type here" oninput="document.title='typed '+this.value">
</body></html>
